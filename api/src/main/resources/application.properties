spring.application.name=estudio-bdd
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estudio_bdd}
spring.datasource.username=${DB_USER:estudio_bdd}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true

app.spa-origin=${SPA_ORIGIN:http://localhost:5173}
app.demo-data=${APP_DEMO_DATA:true}

